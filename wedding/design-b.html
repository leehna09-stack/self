<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>결혼 로드맵 · 시안 B</title>
<link rel="stylesheet" href="roadmap.css">
<style>
/* 시안 B — Midnight Glass: 어두운 오로라 배경 위의 유리 카드, 빛나는 구슬(오브) 아이콘, 떠 있는 탭바 */
:root {
  color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, "Malgun Gothic", sans-serif;
  --bg: #0a0820;
  --bg-img:
    radial-gradient(70% 38% at 12% 0%, rgba(124, 58, 237, .5), transparent 70%),
    radial-gradient(55% 34% at 100% 18%, rgba(255, 79, 154, .38), transparent 70%),
    radial-gradient(70% 45% at 50% 100%, rgba(37, 99, 235, .38), transparent 70%),
    #0a0820;
  --card: rgba(255, 255, 255, .075); --card-border: 1px solid rgba(255, 255, 255, .13);
  --text: #f6f4ff; --muted: #a8a2c8;
  --accent: #ff63ad; --accent-hi: #ff9bd0; --accent-glow: rgba(255, 99, 173, .5);
  --soft: rgba(255, 255, 255, .075); --field: rgba(255, 255, 255, .08); --field-border: 1px solid rgba(255, 255, 255, .14);
  --sheet: #17133a;
  --r: 26px; --r-sm: 18px; --gap: 12px;
  --shadow-card: inset 0 1px 0 rgba(255,255,255,.2), 0 24px 40px -16px rgba(0,0,0,.65);
  --ctl: rgba(255,255,255,.1); --ctl-border: 1px solid rgba(255,255,255,.16); --ctl-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  --ring-track: rgba(255,255,255,.1); --ring1: #ffb35c; --ring2: #ff4fa0; --dot-cur: rgba(255,99,173,.55); --ring-w: 11;
  --ring-glow: drop-shadow(0 0 8px rgba(255,90,170,.8));
  --now-bg: linear-gradient(135deg, rgba(255,99,173,.22), rgba(124,58,237,.22)); --now-shadow: inset 0 1px 0 rgba(255,255,255,.22);
  --ok: #5eeaa0; --ok-soft: rgba(52, 211, 153, .14); --warn: #ff7a7a;
  --task-bg: rgba(255,255,255,.06); --task-gap: 8px; --chk-r: 50%;
  --chk-bg: rgba(255,255,255,.06); --chk-border: 1.6px solid rgba(255,255,255,.3);
  --chk-on: linear-gradient(135deg, #ffb35c, #ff4fa0); --chk-on-shadow: 0 0 14px rgba(255,90,170,.8), inset 0 1px 0 rgba(255,255,255,.5);
  --btn-bg: rgba(255,255,255,.1); --btn-border: 1px solid rgba(255,255,255,.16); --btn-shadow: inset 0 1px 0 rgba(255,255,255,.22);
  --tab-bg: rgba(30, 24, 70, .6); --tab-border: 1px solid rgba(255,255,255,.16); --tab-r: 30px; --tab-bottom: 14px;
  --tab-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 20px 40px rgba(0,0,0,.55); --tab-off: #9a94c0;
  --toast-bg: rgba(255,255,255,.92); --toast-fg: #1a1535;
}
.hero, .stage, dialog { -webkit-backdrop-filter: blur(26px) saturate(150%); backdrop-filter: blur(26px) saturate(150%); }
.tabbar { width: min(536px, calc(100% - 24px)); }
.wrap { padding-bottom: calc(130px + env(safe-area-inset-bottom)); }
h1 { background: linear-gradient(180deg, #fff, #cfc6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dday { background: linear-gradient(90deg, #ffb35c, #ff4fa0); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* 구슬(오브) 아이콘 */
.tile {
  border-radius: 50%;
  background: radial-gradient(circle at 32% 24%, hsl(var(--h) 100% 84%), hsl(var(--h) 95% 60%) 42%, hsl(calc(var(--h) + 22) 90% 30%) 100%);
  box-shadow: inset 0 -7px 12px rgba(0,0,0,.4), inset 0 3px 5px rgba(255,255,255,.55), 0 0 26px hsl(var(--h) 100% 60% / .5), 0 12px 20px rgba(0,0,0,.5);
}
.tile::before { inset: 5% 22% 56% 22%; border-radius: 50%; background: linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,0)); }
.tile .bdg { border-color: #1b1642; }
.tile.lock { filter: grayscale(1) brightness(.75); opacity: .6; }
.stage.lock { opacity: .85; }
.stage.cur { box-shadow: var(--shadow-card), 0 0 0 1.5px rgba(255,99,173,.9), 0 0 28px rgba(255,99,173,.3); }
.task { border-radius: 16px; border: 1px solid rgba(255,255,255,.08); }
.task.on { background: rgba(94, 234, 160, .1); }
.tasks { overflow: visible; }
.opt { background: rgba(255,255,255,.1); }
.btn.primary { background: linear-gradient(135deg, #ffa24d, #ff4fa0 55%, #a855f7); }
input[type=date] { color-scheme: dark; }
dialog { background: rgba(23, 19, 58, .85); border-top: 1px solid rgba(255,255,255,.2); }
.sheet h2 { text-align: center; font-size: 17px; }
</style>
</head>
<body>
<script src="roadmap.js"></script>
</body>
</html>
