<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>결혼 로드맵 · 시안 C</title>
<link rel="stylesheet" href="roadmap.css">
<style>
/* 시안 C — Clay Blush: 말랑하게 부풀린 클레이 질감, 두툼한 압출 아이콘, 파스텔 로즈 웨딩 무드 */
:root {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, "Malgun Gothic", sans-serif;
  --bg: #fff1ec;
  --bg-img: radial-gradient(80% 36% at 0% 0%, #ffd9e2 0%, transparent 70%), radial-gradient(70% 34% at 100% 8%, #ffe8c9 0%, transparent 70%), radial-gradient(80% 40% at 50% 100%, #f6dcff 0%, transparent 70%), #fff4ef;
  --card: #fffdfb; --text: #4a2c33; --muted: #a07f87;
  --accent: #f0597d; --accent-hi: #ff94ac; --accent-glow: rgba(240, 89, 125, .38);
  --soft: #fff0ee; --soft-shadow: inset 0 3px 6px rgba(220,140,150,.22), inset 0 -2px 4px #fff;
  --field: #fff3f0; --field-shadow: inset 0 3px 7px rgba(210,130,140,.25), inset 0 -2px 3px #fff; --sheet: #fff7f3;
  --r: 32px; --r-sm: 22px; --gap: 14px;
  --shadow-card: 0 24px 34px -16px rgba(222, 120, 135, .5), 0 4px 10px rgba(222,120,135,.12), inset 0 7px 9px #fff, inset 0 -9px 14px rgba(255, 190, 200, .3);
  --ctl: #fff6f3; --ctl-shadow: 0 8px 14px -4px rgba(222,120,135,.45), inset 0 3px 4px #fff, inset 0 -4px 6px rgba(255,180,190,.35);
  --ring-track: #ffe3e8; --ring-w: 17; --ring1: #ffb199; --ring2: #f0597d; --dot-cur: #ffc7d3;
  --ring-glow: drop-shadow(0 5px 4px rgba(240,89,125,.35));
  --now-bg: #ffe9ee; --now-shadow: inset 0 4px 6px #fff, inset 0 -5px 9px rgba(255,160,180,.35), 0 10px 16px -8px rgba(240,89,125,.4);
  --ok: #23975a; --ok-soft: #e4f7ea; --warn: #e0412f;
  --task-bg: #fff5f2; --task-gap: 10px; --chk-r: 10px;
  --chk-bg: #fff; --chk-border: 0; --chk-shadow: inset 0 3px 5px rgba(205,125,135,.35), inset 0 -2px 3px #fff, 0 1px 0 #fff;
  --chk-on: linear-gradient(160deg, #ff9bb2, #f0597d); --chk-on-shadow: inset 0 2px 3px rgba(255,255,255,.7), inset 0 -4px 5px rgba(160,30,60,.3), 0 5px 8px -2px rgba(240,89,125,.6);
  --btn-bg: #fff6f3; --btn-r: 18px; --btn-shadow: 0 7px 12px -4px rgba(222,120,135,.45), inset 0 3px 4px #fff, inset 0 -4px 6px rgba(255,180,190,.35);
  --tab-bg: rgba(255, 250, 247, .92); --tab-r: 34px; --tab-bottom: 14px; --tab-off: #b99aa1;
  --tab-shadow: 0 22px 30px -14px rgba(222,120,135,.6), inset 0 5px 7px #fff, inset 0 -7px 11px rgba(255,190,200,.35);
  --toast-bg: #4a2c33; --toast-fg: #fff;
}
.tabbar { width: min(536px, calc(100% - 24px)); }
.wrap { padding-bottom: calc(132px + env(safe-area-inset-bottom)); }
h1, .stitle, .now .t, .stat b { font-weight: 800; }
.stage { border: 0; }
.stage.cur { box-shadow: var(--shadow-card), 0 0 0 3px rgba(240,89,125,.5); }
.tasks { overflow: visible; }
.task { border-radius: 20px; box-shadow: 0 5px 9px -5px rgba(222,120,135,.35), inset 0 2px 3px #fff; }
.task.on { background: #eaf8ef; }
.stat { border-radius: 22px; }
.btn.primary { border-radius: 18px; background: linear-gradient(180deg, #ff9db4, #f0597d); box-shadow: inset 0 3px 4px rgba(255,255,255,.65), inset 0 -5px 7px rgba(160,30,60,.28), 0 9px 14px -5px rgba(240,89,125,.65); }
.hero { padding: 22px; }
.ringtxt b { color: var(--accent); }
.dots i { height: 10px; box-shadow: inset 0 2px 3px rgba(210,130,140,.3); }
.dots i.d { box-shadow: inset 0 2px 2px rgba(255,255,255,.6), inset 0 -2px 3px rgba(160,30,60,.25); }

/* 클레이 아이콘: 말랑한 라운드 + 두툼한 압출 */
.tile {
  width: 56px; height: 56px; border-radius: 36%;
  background: linear-gradient(160deg, hsl(var(--h) 100% 82%), hsl(var(--h) 88% 64%));
  box-shadow: inset 0 6px 8px rgba(255,255,255,.75), inset 0 -9px 13px hsl(var(--h) 70% 40% / .45), 0 14px 18px -6px hsl(var(--h) 75% 48% / .6), 0 2px 3px hsl(var(--h) 60% 40% / .3);
}
.tile.lg { width: 66px; height: 66px; }
.tile::before { inset: 4px 10% 55% 10%; background: linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,0)); }
.tile .gl {
  width: 54%; height: 54%; stroke-width: 2.1; fill: rgba(255,255,255,.55);
  filter: drop-shadow(0 1px 0 hsl(var(--h) 65% 46%)) drop-shadow(0 2px 0 hsl(var(--h) 65% 42%)) drop-shadow(0 3px 0 hsl(var(--h) 65% 38%)) drop-shadow(0 4px 0 hsl(var(--h) 65% 34%)) drop-shadow(0 8px 5px rgba(0,0,0,.25));
}
.tile .bdg { border-color: #fffdfb; }
.sheet h2 { font-size: 24px; }
dialog { box-shadow: 0 -20px 40px rgba(222,120,135,.35), inset 0 6px 9px #fff; }
</style>
</head>
<body>
<script src="roadmap.js"></script>
</body>
</html>
