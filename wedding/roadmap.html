<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="웨딩">
<title>결혼 로드맵</title>
<link rel="stylesheet" href="roadmap.css">
<link rel="stylesheet" href="tabbar.css">
<link rel="stylesheet" href="brand.css">
<style>
/* 로드맵 — 색·모서리는 brand.css(웨딩홀 비교와 공통). 여기서는 로드맵 고유의 배치 값만 정한다 */
:root {
  --field: transparent; --sheet: var(--bg);
  --r: var(--r-card); --r-sm: var(--radius); --gap: 10px;
  --shadow-card: var(--e1);
  --ctl: transparent; --ctl-shadow: none;
  --ring-track: var(--line); --ring1: var(--text); --ring2: var(--text); --ring-w: 3; --dot-cur: #8A8A86; --ring-glow: none;
  --now-bg: var(--accent-soft);
  --task-bg: transparent; --tasks-bg: transparent; --task-line: 1px solid var(--line);
  --chk-bg: transparent; --chk-border: 1px solid #8A8A86; --chk-r: 0; --chk-on: var(--text); --chk-on-shadow: none;
  --btn-bg: transparent; --btn-shadow: none;
  --toast-bg: var(--text); --toast-fg: var(--bg);
}
.btn.primary:hover { background: var(--accent-hi); }
.hero { padding: 18px; }
.now .t { color: var(--text); }
.stage.open .shead { padding-bottom: 8px; }
.stage.cur { box-shadow: var(--shadow-card), 0 0 0 2px var(--accent); }
</style>
<link rel="stylesheet" href="minimal.css">
</head>
<body>
<script src="roadmap.js"></script>
<script src="tabbar.js"></script>
<script src="install.js"></script>
</body>
</html>
