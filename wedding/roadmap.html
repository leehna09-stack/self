<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="웨딩">
<title>결혼 로드맵</title>
<link rel="stylesheet" href="roadmap.css">
<link rel="stylesheet" href="tabbar.css">
<link rel="stylesheet" href="brand.css">
<style>
/* 로드맵 — 색·모서리는 brand.css(웨딩홀 비교와 공통). 여기서는 로드맵 고유의 배치 값만 정한다 */
:root {
  --font: "Wedding Sans", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --field: var(--bg); --sheet: #fff;
  --r: var(--radius); --r-sm: var(--radius); --gap: 10px;
  --shadow-card: inset 0 0 0 1px var(--line);
  --ctl: #fff; --ctl-shadow: inset 0 0 0 1px var(--line);
  --ring-track: var(--accent-soft); --ring1: var(--accent-fill); --ring2: var(--accent); --dot-cur: var(--accent-fill); --ring-glow: none;
  --now-bg: var(--accent-soft);
  --task-bg: transparent; --tasks-bg: var(--bg); --task-line: 1px solid var(--line);
  --chk-bg: #fff; --chk-border: 1.6px solid var(--line); --chk-on: var(--dist); --chk-on-shadow: none;
  --btn-bg: #fff; --btn-shadow: inset 0 0 0 1px var(--line);
  --toast-bg: var(--text); --toast-fg: #fff;
}
.btn.primary:hover { background: var(--accent-hi); }
.hero { padding: 18px; }
.now .t { color: var(--text); }
.stage.open .shead { padding-bottom: 8px; }
.stage.cur { box-shadow: var(--shadow-card), 0 0 0 2px var(--accent); }
</style>
</head>
<body>
<script src="roadmap.js"></script>
<script src="tabbar.js"></script>
<script src="install.js"></script>
</body>
</html>
