<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>결혼 로드맵 · 시안 A</title>
<link rel="stylesheet" href="roadmap.css">
<style>
/* 시안 A — iOS Light: 홈 화면 앱 아이콘처럼 광택 있는 스퀘어클 타일, 그룹 리스트, 반투명 탭바 */
:root {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, "Malgun Gothic", sans-serif;
  --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #8a8a8e;
  --accent: #ff2d55; --accent-hi: #ff6f8e; --accent-glow: rgba(255, 45, 85, .32);
  --soft: #f2f2f7; --field: #f2f2f7; --sheet: #f2f2f7;
  --r: 22px; --r-sm: 14px; --gap: 12px;
  --shadow-card: 0 1px 2px rgba(0,0,0,.05), 0 10px 28px rgba(60,60,90,.07);
  --ctl: #fff; --ctl-shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
  --ring-track: #f3e4e8; --ring1: #ff8aa6; --ring2: #ff2d55; --dot-cur: #ffc3d1;
  --ring-glow: drop-shadow(0 3px 5px rgba(255,45,85,.35));
  --now-bg: #fff0f3; --ok: #1f9d55; --ok-soft: #e9f8ee; --warn: #e5322d;
  --task-bg: transparent; --tasks-bg: #f7f7fa; --task-line: .5px solid rgba(60,60,67,.18);
  --chk-bg: #fff; --chk-border: 1.6px solid #c4c4c9; --chk-on: linear-gradient(180deg, #ff7391, #ff2d55);
  --chk-on-shadow: 0 2px 6px rgba(255,45,85,.4), inset 0 1px 0 rgba(255,255,255,.4);
  --btn-bg: #fff; --btn-shadow: 0 1px 2px rgba(0,0,0,.08), inset 0 0 0 .5px rgba(60,60,67,.15);
  --tab-bg: rgba(249,249,251,.78); --tab-border: 0; --tab-off: #8e8e93;
  --toast-bg: rgba(28,28,30,.92); --toast-fg: #fff;
}
.tabbar { border-top: .5px solid rgba(60,60,67,.22); box-shadow: 0 -1px 0 rgba(255,255,255,.6) inset; }
/* 스퀘어클 아이콘: 입체 광택 한 겹 추가 */
.tile { --tile-r: 22.5%; border-radius: 22.5%; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18), inset 0 0 12px rgba(255,255,255,.18); }
.hero { padding: 20px; }
.now .t { color: var(--text); }
.sheet h2 { text-align: center; font-size: 17px; }
.stage.open .shead { padding-bottom: 8px; }
</style>
</head>
<body>
<script src="roadmap.js"></script>
</body>
</html>
