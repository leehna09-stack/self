<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a110b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>위스키 노트</title>

<!-- ============================================================
  [1] 꾸미기(CSS) - 맨 위 :root 의 색 이름표만 바꿔도 분위기가 바뀌어요
============================================================= -->
<style>
:root {
  --bg: #1a110b;          /* 바탕: 오크통 같은 짙은 갈색 */
  --surface: #261a11;     /* 카드 */
  --surface2: #312216;    /* 카드 위 입력칸 */
  --text: #f6ebdc;
  --muted: #b9a58d;
  --line: #43301f;
  --amber: #e8a33d;       /* 대표색: 위스키 호박색 */
  --amber-soft: #e8a33d26;
  --amber-deep: #b86f12;
  --red: #e5645a;
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea, select { font: inherit; color: var(--text); }
.app { max-width: 560px; margin: 0 auto; padding: calc(var(--safe-t) + 18px) 16px calc(90px + var(--safe-b)); }

/* 상단 제목 */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; }
.brand h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }

/* 요약 카드 */
.hero {
  background: linear-gradient(135deg, #3a2412, #261a11 70%);
  border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center;
}
.hero b { display: block; font-size: 24px; color: var(--amber); letter-spacing: -.02em; }
.hero span { font-size: 12px; color: var(--muted); }

/* 검색/필터 */
.search {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); outline: none;
}
.search:focus, .field:focus { border-color: var(--amber); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); font-size: 13px; white-space: nowrap;
}
.chip.on { background: var(--amber); border-color: var(--amber); color: #2a1904; font-weight: 700; }
.sortrow { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 10px; color: var(--muted); font-size: 12px; }
.sortrow select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }

/* 기록 카드 */
.card {
  display: block; width: 100%; text-align: left; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.card:active { transform: scale(.99); }
.card .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.card .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.card .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.tag { padding: 3px 9px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); font-size: 12px; }
.memo { margin-top: 9px; color: #d9c7ae; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stars { color: var(--amber); letter-spacing: 1px; font-size: 13px; }
.stars i { font-style: normal; color: #5a4430; }

.empty { text-align: center; color: var(--muted); padding: 50px 10px; }
.empty .big { font-size: 46px; margin-bottom: 8px; }

/* 하단 탭 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: #1a110bee; backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
}
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
.tab { padding: 9px 0 8px; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--amber); }
.tab.add .plus {
  width: 46px; height: 46px; border-radius: 50%; margin-top: -20px; display: grid; place-items: center;
  background: linear-gradient(145deg, #f2b552, #c87a14); box-shadow: 0 6px 18px #e8a33d44; color: #2a1904;
}
.tab.add .plus svg { stroke-width: 2.6; }

/* 입력 화면(전체 덮개) */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
.sheet-in { max-width: 560px; margin: 0 auto; padding: calc(var(--safe-t) + 14px) 16px calc(40px + var(--safe-b)); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 18px; }
.link { color: var(--muted); padding: 6px 4px; font-size: 14px; }
.link.danger { color: var(--red); }
label.lb { display: block; margin: 16px 2px 6px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.field {
  width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); outline: none; font-size: 16px;
}
textarea.field { min-height: 96px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.unit { position: relative; }
.unit .field { padding-right: 44px; }
.unit em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-style: normal; font-size: 14px; }
.quick { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.quick .chip { padding: 5px 10px; font-size: 12px; }

/* 자동완성 */
.ac-wrap { position: relative; }
.ac {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; max-height: 300px; overflow-y: auto;
  background: #34241a; border: 1px solid var(--amber-deep); border-radius: 12px;
  box-shadow: 0 14px 30px #000a;
}
.ac button { display: block; width: 100%; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ac button:last-child { border-bottom: 0; }
.ac button:active, .ac button.hi { background: var(--amber-soft); }
.ac b { display: block; font-weight: 600; }
.ac small { color: var(--muted); font-size: 12px; }
.ac mark { background: none; color: var(--amber); }
.autonote { margin: 8px 2px 0; font-size: 12px; color: var(--amber); }

/* 맛 선택 */
.flavors { display: flex; flex-wrap: wrap; gap: 7px; }
.flavors .chip { font-size: 14px; padding: 8px 12px; }
.flavors .chip.pre:not(.on) { border-color: var(--amber-deep); }

/* 별점 */
.rate { display: flex; gap: 4px; }
.rate button { font-size: 30px; line-height: 1; color: #5a4430; padding: 2px; }
.rate button.on { color: var(--amber); }

.btn-main {
  width: 100%; margin-top: 24px; padding: 15px; border-radius: 14px; font-weight: 700; font-size: 16px;
  background: linear-gradient(145deg, #f2b552, #c87a14); color: #2a1904;
}
.btn-sub { width: 100%; margin-top: 10px; padding: 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }

/* 통계 */
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.box h3 { margin: 0 0 12px; font-size: 14px; color: var(--muted); font-weight: 600; }
.bar { display: grid; grid-template-columns: 78px 1fr 30px; gap: 8px; align-items: center; margin: 7px 0; font-size: 13px; }
.bar .tr { height: 10px; background: #3a291b; border-radius: 6px; overflow: hidden; }
.bar .fi { height: 100%; background: linear-gradient(90deg, var(--amber-deep), var(--amber)); border-radius: 6px; }
.bar .n { text-align: right; color: var(--muted); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi b { display: block; font-size: 22px; color: var(--amber); margin-top: 2px; }
.fav { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.fav:first-of-type { border-top: 0; }

.settings p { color: var(--muted); font-size: 13px; margin: 4px 2px 10px; }
.toast {
  position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%); z-index: 99;
  background: #f6ebdc; color: #2a1904; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 13px;
  box-shadow: 0 8px 24px #0008;
}
</style>
</head>

/* 한글 초성 검색 지원 (예: "ㅁㅋㄹ" → 맥캘란) */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s => [...s].map(c => { const n = c.charCodeAt(0) - 0xAC00; return n >= 0 && n < 11172 ? CHO[Math.floor(n / 588)] : c; }).join('');
const norm = s => s.toLowerCase().replace(/[\s'’·.\-]/g, '');

/* 자동완성 후보: 내장 DB + 내가 예전에 직접 적은 위스키 */
function candidates() {
  const list = DB.map(([ko, en, type, ml, abv, fl]) => ({ ko, en, type, ml, abv, fl, src: 'db' }));
  const seen = new Set(list.map(x => norm(x.ko)));
  [...logs].reverse().forEach(l => {
    if (!seen.has(norm(l.name))) { seen.add(norm(l.name)); list.push({ ko: l.name, en: '', type: '내 기록', ml: l.ml, abv: l.abv, fl: l.flavors || [], src: 'mine' }); }
  });
  return list;
}
function search(q) {
  q = norm(q); if (!q) return [];
  const isCho = /^[ㄱ-ㅎ]+$/.test(q);
  const scored = [];
  candidates().forEach(c => {
    const ko = norm(c.ko), en = norm(c.en);
    let sc = -1;
    if (ko.startsWith(q) || en.startsWith(q)) sc = 0;
    else if (ko.includes(q) || en.includes(q)) sc = 1;
    else if (isCho && cho(ko).includes(q)) sc = 2;
    if (sc >= 0) scored.push([sc, c]);
  });
  return scored.sort((a, b) => a[0] - b[0]).slice(0, 8).map(x => x[1]);
}
/* 여러 단어를 띄어 쓴 경우(예: "맥캘란 12")는 모든 단어가 들어있는 것만 */
function searchWords(raw) {
  const words = raw.toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  if (words.length < 2) return search(raw);
  return candidates().filter(c => { const t = norm(c.ko + ' ' + c.en); return words.every(w => t.includes(w)); }).slice(0, 8);
}
const hl = (text, raw) => {
  const q = raw.trim(); if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
};

function filtered() {
  let arr = logs.slice();
  const q = norm(state.q);
  if (q) arr = arr.filter(l => norm(l.name + ' ' + (l.memo || '') + ' ' + (l.flavors || []).join('')).includes(q) || cho(norm(l.name)).includes(q));
  if (state.flavor) {
    const f = state.flavor === '과일' ? FRUITS : [state.flavor];
    arr = arr.filter(l => (l.flavors || []).some(x => f.includes(x)));
  }
  const by = {
    new: (a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created,
    old: (a, b) => (a.date || '').localeCompare(b.date || '') || a.created - b.created,
    rate: (a, b) => (b.rating || 0) - (a.rating || 0) || (b.date || '').localeCompare(a.date || ''),
    abv: (a, b) => (b.abv || 0) - (a.abv || 0),
    name: (a, b) => a.name.localeCompare(b.name, 'ko'),
  }[state.sort];
  return arr.sort(by);
}

function viewStats() {
  if (!logs.length) return header('통계') + `<div class="empty"><div class="big">📊</div>기록이 쌓이면 취향 통계가 보여요</div>`;
  const cnt = {};
  logs.forEach(l => (l.flavors || []).forEach(f => cnt[f] = (cnt[f] || 0) + 1));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 7);
  const topMax = top.length ? top[0][1] : 1;
  const withAbv = logs.filter(l => l.abv);
  const avgAbv = withAbv.length ? fmtNum(withAbv.reduce((s, l) => s + l.abv, 0) / withAbv.length) : '-';
  /* 최근 6개월 */
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
  const mc = months.map(m => [m, logs.filter(l => (l.date || '').startsWith(m)).length]);
  const mMax = Math.max(1, ...mc.map(x => x[1]));
  /* 종류별 */
  const typeOf = l => { const hit = DB.find(d => norm(d[0]) === norm(l.name)); return hit ? hit[2] : '기타·직접입력'; };
  const tc = {}; logs.forEach(l => { const t = typeOf(l); tc[t] = (tc[t] || 0) + 1; });
  const tEntries = Object.entries(tc).sort((a, b) => b[1] - a[1]);
  const tMax = tEntries[0][1];
  /* 최애 */
  const favs = logs.filter(l => l.rating >= 4).sort((a, b) => b.rating - a.rating || (b.date || '').localeCompare(a.date || '')).slice(0, 5);
  const bar = (label, n, max) => `<div class="bar"><span>${label}</span><div class="tr"><div class="fi" style="width:${Math.max(4, n / max * 100)}%"></div></div><span class="n">${n}</span></div>`;
  return header('내 취향 통계') + `
    <div class="kpis"><div class="kpi"><span>평균 도수</span><b>${avgAbv}${avgAbv === '-' ? '' : '%'}</b></div>
    <div class="kpi"><span>가장 많이 고른 맛</span><b>${top.length ? (FICON[top[0][0]] || '') + ' ' + esc(top[0][0]) : '-'}</b></div></div>
    <div class="box"><h3>자주 고른 맛 TOP</h3>${top.length ? top.map(([f, n]) => bar((FICON[f] || '') + ' ' + esc(f), n, topMax)).join('') : '<span style="color:var(--muted)">맛 특징을 선택하면 집계돼요</span>'}</div>
    <div class="box"><h3>최근 6개월 마신 횟수</h3>${mc.map(([m, n]) => bar(m.slice(2).replace('-', '.'), n, mMax)).join('')}</div>
    <div class="box"><h3>종류별</h3>${tEntries.map(([t, n]) => bar(esc(t), n, tMax)).join('')}</div>
    <div class="box"><h3>⭐ 별 4개 이상 최애 위스키</h3>${favs.length ? favs.map(l => `<div class="fav"><span>${esc(l.name)}</span>${stars(l.rating)}</div>`).join('') : '<span style="color:var(--muted)">별점 4개 이상을 주면 여기에 모여요</span>'}</div>`;
}

function viewSettings() {
  return header('설정·백업') + `<div class="settings">
    <div class="box"><h3>백업 / 복원</h3>
      <p>기록은 이 기기의 브라우저에 저장돼요. 폰을 바꾸거나 가족과 나눌 땐 파일로 내보내서 옮기세요.</p>
      <button class="btn-sub" id="exp" style="margin-top:0">📤 기록 파일로 내보내기 (JSON)</button>
      <button class="btn-sub" id="expcsv">📄 엑셀용 CSV로 내보내기</button>
      <button class="btn-sub" id="imp">📥 백업 파일 불러오기</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <div class="box"><h3>정보</h3>
      <p>내장 위스키 ${DB.length}종 · 내 기록 ${logs.length}건<br>목록에 없는 위스키는 이름을 직접 쓰면 다음부터 자동완성에 나와요.<br>내장 정보는 시판 제품 기준 참고값이라 자유롭게 수정할 수 있어요.</p>
    </div>
    <div class="box"><h3>위험 구역</h3><button class="btn-sub" id="wipe" style="margin-top:0;color:var(--red)">🗑 모든 기록 삭제</button></div>
  </div>`;
}

function bindView() {
  const q = $('#q');
  if (q) q.addEventListener('input', e => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  const so = $('#sort'); if (so) so.onchange = e => { state.sort = e.target.value; render(); };
  document.querySelectorAll('[data-flavor]').forEach(b => b.onclick = () => { state.flavor = b.dataset.flavor; render(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm(b.dataset.edit));
  if ($('#exp')) {
    $('#exp').onclick = () => download('whisky-notes-' + today() + '.json', JSON.stringify({ app: 'whisky-notes', version: 1, logs }, null, 2), 'application/json');
    $('#expcsv').onclick = () => {
      const rows = [['날짜', '위스키', '용량(ml)', '도수(%)', '맛', '별점', '메모']].concat(logs.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(l => [l.date, l.name, l.ml, l.abv, (l.flavors || []).join('/'), l.rating || '', l.memo || '']));
      const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
      download('whisky-notes-' + today() + '.csv', csv, 'text/csv');
    };
    $('#imp').onclick = () => $('#file').click();
    $('#file').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        const inc = Array.isArray(data) ? data : data.logs;
        if (!Array.isArray(inc)) throw 0;
        const ids = new Set(logs.map(l => l.id));
        let add = 0;
        inc.forEach(l => { if (l && l.name && !ids.has(l.id)) { logs.push({ id: l.id || uid(), name: String(l.name), ml: +l.ml || 0, abv: +l.abv || 0, flavors: Array.isArray(l.flavors) ? l.flavors : [], memo: l.memo || '', date: l.date || today(), rating: +l.rating || 0, created: l.created || Date.now() }); add++; } });
        store.save(logs); toast(add + '건을 불러왔어요'); render();
      } catch { toast('올바른 백업 파일이 아니에요'); }
    };
    $('#wipe').onclick = () => { if (confirm('모든 기록을 삭제할까요?\n(백업하지 않았다면 되돌릴 수 없어요)') && confirm('정말 삭제합니다.')) { logs = []; store.save(logs); toast('삭제했어요'); render(); } };
  }
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================
  [5] 기록 입력/수정 화면
============================================================= */
function openForm(id) {
  const old = id ? logs.find(l => l.id === id) : null;
  const f = old ? { ...old, flavors: [...(old.flavors || [])] } : { name: '', ml: 700, abv: '', flavors: [], memo: '', date: today(), rating: 0 };
  let pre = new Set(); // 자동으로 채워진 맛 (표시용)
  let note = '';
  const root = $('#sheetRoot');
  const close = () => { root.innerHTML = ''; document.body.style.overflow = ''; };
  document.body.style.overflow = 'hidden';

  const draw = () => {
    root.innerHTML = `<div class="sheet"><div class="sheet-in">
      <div class="sheet-head"><button class="link" id="cancel">취소</button><h2>${old ? '기록 수정' : '한 잔 기록하기'}</h2><button class="link" id="del" style="${old ? '' : 'visibility:hidden'}" ><span class="danger" style="color:var(--red)">삭제</span></button></div>

      <label class="lb">위스키 이름</label>
      <div class="ac-wrap"><input class="field" id="name" placeholder="예: 맥캘란, glenfiddich, ㄱㄹㅍㄷ" value="${esc(f.name)}" autocomplete="off" autocapitalize="off"><div class="ac" id="ac" hidden></div></div>
      <div class="autonote" id="note">${esc(note)}</div>

      <div class="grid2">
        <div><label class="lb">용량</label><div class="unit"><input class="field" id="ml" type="number" inputmode="numeric" min="0" value="${f.ml || ''}"><em>ml</em></div></div>
        <div><label class="lb">알콜 도수</label><div class="unit"><input class="field" id="abv" type="number" inputmode="decimal" step="0.1" min="0" max="100" value="${f.abv || ''}"><em>%</em></div></div>
      </div>
      <div class="quick">${VOLS.map(v => `<button class="chip ${+f.ml === v ? 'on' : ''}" data-vol="${v}">${v}ml</button>`).join('')}</div>

      <label class="lb">맛의 특징 (여러 개 선택)</label>
      <div class="flavors" id="fl">${FLAVORS.map(([n, ic]) => `<button class="chip ${f.flavors.includes(n) ? 'on' : ''} ${pre.has(n) ? 'pre' : ''}" data-f="${esc(n)}">${ic} ${n}</button>`).join('')}</div>

      <label class="lb">별점</label>
      <div class="rate" id="rate">${[1, 2, 3, 4, 5].map(i => `<button class="${i <= f.rating ? 'on' : ''}" data-r="${i}">★</button>`).join('')}</div>

      <label class="lb">마신 날짜</label>
      <input class="field" id="date" type="date" value="${esc(f.date)}">

      <label class="lb">메모</label>
      <textarea class="field" id="memo" placeholder="누구와, 어디서, 어떤 느낌이었는지 자유롭게 적어보세요">${esc(f.memo)}</textarea>

      <button class="btn-main" id="save">${old ? '수정 저장' : '기록 저장'}</button>
    </div></div>`;
    bindForm();
  };

  const readFields = () => {
    f.name = $('#name').value; f.ml = +$('#ml').value || 0; f.abv = +$('#abv').value || 0;
    f.date = $('#date').value; f.memo = $('#memo').value;
  };

  const bindForm = () => {
    $('#cancel').onclick = close;
    if (old) $('#del').onclick = () => { if (confirm(`"${old.name}" 기록을 삭제할까요?`)) { logs = logs.filter(l => l.id !== old.id); store.save(logs); close(); toast('삭제했어요'); render(); } };
    const name = $('#name'), ac = $('#ac');
    let hi = -1, res = [];
    const pick = c => {
      readFields();
      f.name = c.ko; f.ml = c.ml; f.abv = c.abv;
      f.flavors = [...c.fl]; pre = new Set(c.fl);
      note = c.src === 'db' ? `✨ ${c.en || c.type} · 용량·도수·맛을 자동으로 채웠어요. 마신 느낌에 맞게 고쳐주세요.` : '✨ 예전에 적은 기록에서 불러왔어요.';
      draw();
    };
    const showAc = () => {
      res = searchWords(name.value);
      hi = -1;
      if (!res.length || (res.length === 1 && norm(res[0].ko) === norm(name.value))) { ac.hidden = true; return; }
      ac.hidden = false;
      ac.innerHTML = res.map((c, i) => `<button type="button" data-i="${i}"><b>${hl(c.ko, name.value)}</b><small>${esc(c.en ? c.en + ' · ' : '')}${esc(c.type)} · ${c.ml}ml · ${c.abv}%</small></button>`).join('');
      ac.querySelectorAll('button').forEach(b => b.onmousedown = e => { e.preventDefault(); pick(res[+b.dataset.i]); });
    };
    name.addEventListener('input', () => { note = ''; $('#note').textContent = ''; showAc(); });
    name.addEventListener('focus', showAc);
    name.addEventListener('blur', () => setTimeout(() => ac.hidden = true, 120));
    name.addEventListener('keydown', e => {
      if (ac.hidden) return;
      const bs = ac.querySelectorAll('button');
      if (e.key === 'ArrowDown') { hi = Math.min(bs.length - 1, hi + 1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); e.preventDefault(); }
      else if (e.key === 'Enter' && hi >= 0) { e.preventDefault(); pick(res[hi]); return; }
      else if (e.key === 'Escape') { ac.hidden = true; return; }
      else return;
      bs.forEach((b, i) => b.classList.toggle('hi', i === hi));
    });

    root.querySelectorAll('[data-vol]').forEach(b => b.onclick = () => { readFields(); f.ml = +b.dataset.vol; draw(); });
    root.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
      const n = b.dataset.f, i = f.flavors.indexOf(n);
      if (i >= 0) f.flavors.splice(i, 1); else f.flavors.push(n);
      b.classList.toggle('on', i < 0);
    });
    root.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      const r = +b.dataset.r; f.rating = f.rating === r ? 0 : r;
      root.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', +x.dataset.r <= f.rating));
    });
    $('#save').onclick = () => {
      readFields();
      const nm = f.name.trim();
      if (!nm) { toast('위스키 이름을 입력해주세요'); $('#name').focus(); return; }
      if (f.abv > 100 || f.abv < 0) { toast('도수를 확인해주세요'); return; }
      const rec = { id: old ? old.id : uid(), name: nm, ml: f.ml, abv: f.abv, flavors: f.flavors, memo: f.memo.trim(), date: f.date || today(), rating: f.rating, created: old ? old.created : Date.now() };
      if (old) logs = logs.map(l => l.id === old.id ? rec : l); else logs.push(rec);
      store.save(logs); close(); toast(old ? '수정했어요' : '기록했어요 🥃');
      state.tab = 'list'; render();
    };
  };
  draw();
  if (!old) setTimeout(() => { const n = $('#name'); n && n.focus(); }, 60);
}

/* ============================================================
  [6] 시작
============================================================= */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  if (t.dataset.tab === 'add') return openForm();
  state.tab = t.dataset.tab; window.scrollTo(0, 0); render();
});
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
