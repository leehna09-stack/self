/* 다이어리 기록 보기 (읽기 전용). 수정은 위쪽 연필 아이콘 */
function openDiaryDetail(id) {
  const l = logs.find(x => x.id === id); if (!l) return;
  const root = $('#sheetRoot'); document.body.style.overflow = 'hidden';
  const close = () => { root.innerHTML = ''; document.body.style.overflow = ''; };
  const photos = photoMap[l.id] || [];
  const [icon, color] = typeStyle(l.name);
  const sub = [typeOfName(l.name) !== '기타·직접입력' ? typeOfName(l.name) : '', l.ml ? volLabel(l.ml) : '', l.abv ? l.abv + '%' : ''].filter(Boolean).join(' · ');
  const row = (k, v) => `<div class="dr"><span class="dk">${k}</span><span class="dv">${v}</span></div>`;
  const rows = [row('마신 날짜', fmtDate(l.date))];
  if (l.openDate) rows.push(row('오픈한 날짜', fmtDate(l.openDate)));
  if (l.rating) rows.push(row('나의 점수', stars(l.rating)));
  const buy = [];
  if (l.price > 0) buy.push(row('구매가격', `<b>${won(l.price)}</b>${isLowest(l) ? ' <span class="low">최저가</span>' : ''}`));
  if (l.price > 0) buy.push(row('구매일', fmtDate(buyDateOf(l))));
  if (l.shop) buy.push(row('구매 장소', esc(l.shop)));
  root.innerHTML = `<div class="sheet"><div class="sheet-in">
    <div class="sheet-head"><button class="link" id="vclose">닫기</button><h2>${ic('i-book')} 기록 보기</h2><button type="button" class="eic" id="vedit" aria-label="수정" title="수정">${ic('i-pen')}</button></div>
    ${photos.length ? `<div class="dph ${photos.length > 1 ? 'multi' : ''}" id="vph">${photos.map((p, n) => `<img src="${p.full}" data-vi="${n}" alt="사진 ${n + 1}">`).join('')}</div>` : ''}
    <div class="pd-title vt">${photos.length ? '' : `<span class="tile ${color}">${ic(icon)}</span>`}<div><h3>${esc(l.name)}</h3>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>
    <div class="box vbox plain">${rows.join('')}</div>
    ${(l.flavors || []).length ? `<div class="box vbox"><h3>${ic('i-dram')} 맛의 특징</h3><div class="tags">${l.flavors.map(f => `<span class="tag">${FICON[f] || ''} ${esc(f)}</span>`).join('')}</div></div>` : ''}
    ${buy.length ? `<div class="box vbox"><h3>${ic('i-tag')} 구매 정보</h3>${buy.join('')}${l.price > 0 ? `<button type="button" class="btn-sub" id="vprice">${ic('i-won')} 가격 변동 보기</button>` : ''}</div>` : ''}
    ${l.memo ? `<div class="box vbox"><h3>${ic('i-pen')} 메모</h3><div class="vmemo">${esc(l.memo)}</div></div>` : ''}
  </div></div>`;
  $('#vclose').onclick = close;
  $('#vedit').onclick = () => openForm(l.id, { fromDetail: true });
  root.querySelectorAll('[data-vi]').forEach(im => im.onclick = () => openViewer(photos, +im.dataset.vi));
  const vp = $('#vprice'); if (vp) vp.onclick = () => openPriceDetail(gkey(l));
}

function openForm(id, opts = {}) {
  const old = id ? logs.find(l => l.id === id) : null;
  const f = old ? { price: '', shop: '', buyDate: old.buyDate || old.date, ...old, flavors: [...(old.flavors || [])], photos: (photoMap[old.id] || []).slice() } : { name: '', ml: 700, abv: '', flavors: [], memo: '', date: today(), rating: 0, price: '', shop: '', buyDate: today(), photos: [] };
  let pre = new Set(); // 자동으로 채워진 맛 (표시용)

    root.innerHTML = `<div class="sheet"><div class="sheet-in">

      <label class="lb">${ic('i-bottle')} 위스키 이름</label>
      <div class="ac-wrap"><input class="field" id="name" placeholder="예: 맥캘란, glenfiddich, ㄱㄹㅍㄷ" value="${esc(f.name)}" autocomplete="off" autocapitalize="off"><div class="ac" id="ac" hidden></div></div>
      <div class="autonote" id="note"></div>

      <div class="grid2">
        <div><label class="lb">${ic('i-bottle')} 용량</label><div class="unit"><input class="field" id="ml" type="number" inputmode="numeric" min="0" value="${f.ml || ''}"><em>ml</em></div></div>
        <div><label class="lb">${ic('i-drop')} 알콜 도수</label><div class="unit"><input class="field" id="abv" type="number" inputmode="decimal" step="0.1" min="0" max="100" value="${f.abv || ''}"><em>%</em></div></div>
      </div>
      <div class="quick vols" id="vols">${VOLS.map(v => `<button type="button" class="chip ${+f.ml === v ? 'on' : ''}" data-vol="${v}">${volLabel(v)}</button>`).join('')}</div>

      <label class="lb">${ic('i-dram')} 맛의 특징 (여러 개 선택)</label>
      <div class="flavors" id="fl">${FLAVORS.map(([n, icn]) => `<button class="chip ${f.flavors.includes(n) ? 'on' : ''} ${pre.has(n) ? 'pre' : ''}" data-f="${esc(n)}">${icn} ${n}</button>`).join('')}</div>
      <div class="fl-sel" id="flsel"></div>

      <label class="lb">${ic('i-glass')} 나의 점수</label>
      <div class="rate" id="rate"></div>

      <div class="grid2">
        <div><label class="lb">${ic('i-cal')} 마신 날짜</label><input class="field dt" id="date" type="date" value="${esc(f.date)}"></div>
        <div><label class="lb">${ic('i-bottle')} 오픈한 날짜</label><input class="field dt" id="opendate" type="date" value="${esc(f.openDate || '')}"></div>
      </div>

      <label class="lb">${ic('i-camera')} 사진 <span style="color:var(--muted);font:12px var(--hand)">(최대 ${MAX_PHOTOS}장)</span></label>
      <div class="photos" id="photos"></div>

      <label class="lb">${ic('i-tag')} 구매 정보 <span style="color:var(--muted);font:12px var(--hand)">(선택)</span></label>
      <div class="buy">
        <div class="grid2">
          <div><label class="lb">${ic('i-won')} 구매가격</label><div class="unit"><input class="field" id="price" type="number" inputmode="numeric" min="0" step="100" value="${f.price || ''}" placeholder="0"><em>원</em></div></div>
          <div><label class="lb">${ic('i-cal')} 구매일</label><input class="field" id="buydate" type="date" value="${esc(f.buyDate)}"></div>
        </div>
        <div class="hint" id="pricehint"></div>
        <label class="lb">${ic('i-shop')} 구매 장소</label>
        <input class="field" id="shop" placeholder="예: 코스트코 양재점, 면세점, 쿠팡" value="${esc(f.shop)}" maxlength="40" autocomplete="off">
        <div class="quick">${shopChoices().map(sh => `<button type="button" class="chip ${f.shop === sh ? 'on' : ''}" data-shop="${esc(sh)}">${esc(sh)}</button>`).join('')}</div>

      <button class="btn-main" id="save">${ic('i-glass')} ${old ? '수정 저장' : '다이어리에 기록'}</button>

    bindForm();

  const readFields = () => {

      ac.querySelectorAll('button').forEach(b => b.onmousedown = e => { e.preventDefault(); pick(res[+b.dataset.i]); });

    name.addEventListener('input', () => { note = ''; $('#note').textContent = ''; showAc(); });
    name.addEventListener('focus', showAc);
    name.addEventListener('blur', () => setTimeout(() => ac.hidden = true, 120));
    name.addEventListener('keydown', e => {

      if (e.key === 'ArrowDown') { hi = Math.min(bs.length - 1, hi + 1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); e.preventDefault(); }
      else if (e.key === 'Enter' && hi >= 0) { e.preventDefault(); pick(res[hi]); return; }
      else if (e.key === 'Escape') { ac.hidden = true; return; }
      else return;

      const on = volsEl.querySelector('.on'); if (!on) return;
      const v = volsEl.getBoundingClientRect(), c = on.getBoundingClientRect();
      volsEl.scrollLeft += (c.left + c.width / 2) - (v.left + v.width / 2);
    };
    const markVol = () => volsEl.querySelectorAll('[data-vol]').forEach(x => x.classList.toggle('on', +x.dataset.vol === (+$('#ml').value || 0)));
    volsEl.querySelectorAll('[data-vol]').forEach(b => b.onclick = () => { $('#ml').value = b.dataset.vol; markVol(); updateHint(); });
    $('#ml').addEventListener('input', markVol);
    showVol();
    root.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
      const n = b.dataset.f, i = f.flavors.indexOf(n);
      if (i >= 0) f.flavors.splice(i, 1); else f.flavors.push(n);
      b.classList.toggle('on', i < 0);
      updateFlSel();
    });
    updateFlSel();
    const rateEl = $('#rate');
    const drawRate = () => {
      rateEl.innerHTML = rateHtml(f.rating);
      rateEl.querySelectorAll('[data-r]').forEach(b => b.onclick = e => {
        const i = +b.dataset.r, rect = b.getBoundingClientRect();
        /* 키보드로 누른 경우(e.detail === 0)는 1점 단위, 터치·클릭은 누른 위치가 왼쪽 절반이면 0.5점 */
        const v = e.detail !== 0 && e.clientX - rect.left < rect.width / 2 ? i - 0.5 : i;
        f.rating = f.rating === v ? 0 : v;
        drawRate();
      });
    };
    drawRate();
    $('#save').onclick = async () => {
      readFields();
      const nm = f.name.trim();
      if (!nm) { toast('위스키 이름을 입력해주세요'); $('#name').focus(); return; }
      if (f.abv > 100 || f.abv < 0) { toast('도수를 확인해주세요'); return; }
      if (f.price < 0) { toast('구매가격을 확인해주세요'); return; }
      if (f.openDate && f.date && f.openDate > f.date) { toast('오픈한 날짜는 마신 날짜보다 늦을 수 없어요'); return; }
      const rec = { id: old ? old.id : uid(), name: nm, ml: f.ml, abv: f.abv, flavors: f.flavors, memo: f.memo.trim(), date: f.date || today(), openDate: f.openDate || '', rating: f.rating, price: f.price, shop: f.shop, buyDate: f.price > 0 ? (f.buyDate || f.date || today()) : '', created: old ? old.created : Date.now() };
      if (old) logs = logs.map(l => l.id === old.id ? rec : l); else logs.push(rec);
      $('#save').disabled = true;
      store.save(logs);
      let photoFail = false;
      if (f.photos.length || photoMap[rec.id]) {
        photoFail = !(await PH.set(rec.id, f.photos));
        if (!photoFail) { if (f.photos.length) { photoMap[rec.id] = f.photos; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} } else delete photoMap[rec.id]; }
      }
      close(); toast(photoFail ? '기록은 저장했지만 사진은 저장하지 못했어요' : old ? '수정했어요' : '다이어리에 기록했어요');
      state.tab = 'list'; render();
      if (opts.fromDetail) openDiaryDetail(rec.id);
    };
  };
  draw();
  if (!old) setTimeout(() => { const n = $('#name'), a = document.activeElement; if (n && !n.value && (!a || a === document.body)) n.focus(); }, 60);
}

/* ============================================================
  [6] 시작
============================================================= */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  const next = t.dataset.tab, changed = next !== state.tab;
  state.tab = next; window.scrollTo(0, 0); render();
  if (changed) history.pushState({ tab: next }, '');
});

/* 폰의 뒤로가기: 앱이 닫히지 않고 한 단계씩 돌아가요
   열려 있는 사진 보기·팝업·입력 화면을 먼저 닫고, 그다음엔 이전에 보던 탭으로 가요 */
(() => {
  const root = $('#sheetRoot');
  const overlays = () => (root.firstElementChild ? 1 : 0) + document.querySelectorAll('.viewer').length + document.querySelectorAll('.modal:not([hidden])').length;
  let pushed = 0, ignore = 0;
  try { history.replaceState({ tab: state.tab }, ''); } catch {}
  const sync = () => {
    const n = overlays();
    if (n > pushed) { while (pushed < n) { history.pushState({ ov: 1 }, ''); pushed++; } }
    else if (n < pushed) { const d = pushed - n; pushed = n; ignore += d; history.go(-d); }   /* 취소·저장 등으로 직접 닫은 경우 기록 칸도 되돌려요 */
  };
  const closeTop = () => {
    const v = document.querySelector('.viewer'); if (v) { const x = v.querySelector('.vx'); if (x) x.click(); else v.remove(); return; }
    const m = document.querySelector('.modal:not([hidden])'); if (m) { m.hidden = true; return; }
    root.innerHTML = ''; document.body.style.overflow = '';
  };
  window.addEventListener('popstate', e => {
    if (ignore > 0) { ignore--; return; }
    if (pushed > 0) { pushed--; closeTop(); return; }
    const t = e.state && e.state.tab;
    if (t && t !== state.tab) { state.tab = t; window.scrollTo(0, 0); render(); }
  });
  const ob = new MutationObserver(sync);
  ob.observe(root, { childList: true });
  ob.observe(document.body, { childList: true });
  ob.observe(document.body, { attributes: true, attributeFilter: ['hidden'], subtree: true });
})();
$('#installClose').onclick = () => { $('#installModal').hidden = true; };
$('#installModal').onclick = e => { if (e.target.id === 'installModal') e.currentTarget.hidden = true; };
render();
PH.open().then(PH.all).then(m => { photoMap = m; if (!$('#sheetRoot').innerHTML.trim()) render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
