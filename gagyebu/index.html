<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1c1917">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<title>우리 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<!-- ============================================================
  [1] 꾸미기(CSS) 영역
  - 색, 글자 크기, 간격 같은 "모양"만 여기서 정해요.
  - 맨 위 :root 안의 값(색 이름표)만 바꿔도 전체 분위기가 바뀌어요.
============================================================= -->
<style>
:root {
  --bg: #f6f5f3;        /* 화면 바탕 (따뜻한 연회색) */
  --surface: #ffffff;   /* 카드 바탕 (흰색) */
  --text: #1c1917;      /* 기본 글자색 */
  --muted: #57534e;     /* 보조 글자색 */
  --line: #e7e5e4;      /* 구분선 */
  --dark: #1c1917;      /* 한나 막대 / 주요 버튼 */
  --mid: #78716c;       /* 동일 막대 / 입력칸 테두리 */
  --red: #b91c1c;       /* 증가·삭제 강조에만 사용 */
  --green: #15803d;     /* 감소 강조에만 사용 */
  --radius: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  letter-spacing: -0.01em;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 20px calc(96px + env(safe-area-inset-bottom)); }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
h2 { font-size: 18px; font-weight: 700; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 500; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* 위쪽: 제목 + 누가 쓰는지 고르는 버튼 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.who { display: flex; gap: 4px; }
.who button, .tabs button {
  min-height: 44px; padding: 0 14px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent;
  font: inherit; color: var(--muted); cursor: pointer; touch-action: manipulation;
}
.who button[aria-selected="true"], .tabs button[aria-selected="true"] { color: var(--text); font-weight: 700; border-bottom-color: var(--dark); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(28,25,23,.05); }

/* 버튼 공통 */
.btn {
  min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--mid);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation;
}
.btn.primary { background: var(--dark); border-color: var(--dark); color: #fff; }
.btn:active { opacity: .8; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--text); text-decoration: underline; cursor: pointer; touch-action: manipulation; }
.link.danger { color: var(--red); }
:focus-visible { outline: 3px solid var(--dark); outline-offset: 2px; }

/* 월 이동 */
.monthnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.monthnav h2 { margin: 0; }
.icon-btn { width: 48px; height: 48px; border: 1px solid var(--mid); border-radius: 10px; background: var(--surface); display: grid; place-items: center; cursor: pointer; touch-action: manipulation; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* 합계 카드 */
.label { color: var(--muted); font-size: 14px; }
.big { font-size: 32px; font-weight: 800; line-height: 1.2; margin-bottom: 14px; }
.empty { color: var(--muted); padding: 8px 0; }
.empty.card { white-space: pre-line; padding: 32px 24px; text-align: center; line-height: 1.7; }
.bar { position: relative; display: flex; height: 40px; border-radius: 10px; overflow: hidden; background: var(--line); }
.bar button { flex: 0 1 auto; min-width: 24px; height: 100%; margin: 0; padding: 0; border: 0; cursor: pointer; touch-action: manipulation; color: #fff; font: inherit; font-weight: 700; white-space: nowrap; overflow: hidden; }
.seg-a { background: var(--dark); }
.seg-b { background: var(--mid); }
.bar button:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }
.mid-tick { position: absolute; top: 0; bottom: 0; left: calc(50% - 1px); width: 2px; background: #fff; pointer-events: none; }
.reveal { margin: 8px 0 10px; min-height: 26px; color: var(--muted); font-size: 14px; }
.reveal.on { color: var(--text); font-size: 18px; font-weight: 700; }
.over { color: var(--red); font-weight: 700; margin: -6px 0 12px; }
.legend { list-style: none; margin: 0 0 14px; padding: 0; }
.legend li { display: flex; align-items: center; gap: 8px; min-height: 40px; border-bottom: 1px solid var(--line); }
.legend li:last-child { border-bottom: 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dot.a { background: var(--dark); } .dot.b { background: var(--mid); }
.legend .nm { font-weight: 700; }
.legend .pct { margin-left: auto; font-weight: 700; }
.cats { color: var(--muted); font-size: 14px; margin-top: 10px; }

/* 코드 입력 / 사용자 선택 창 */
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(28,25,23,.6); }
.modal-box { width: 100%; max-width: 400px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: var(--radius); padding: 20px; }
.modal-box h2 { margin-bottom: 8px; }
.modal-box .hint { margin: 0 0 14px; }
.modal-box .btn { width: 100%; margin-top: 10px; }
.seg .btn { margin-top: 0; }
.actions .btn { margin-top: 0; width: auto; }
.actions .primary { flex: 1; }

/* 달력 */
.cal { padding: 12px 8px; }
.cal h2, .cal .hint { padding: 0 8px; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calhead { text-align: center; font-size: 14px; color: var(--muted); padding: 4px 0; }
.day {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
  min-height: 56px; padding: 6px 0 4px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); font: inherit; color: var(--text); cursor: pointer; touch-action: manipulation;
}
.day:active { background: var(--bg); }
.day .dn { font-size: 16px; line-height: 1.2; }
.day .da { font-size: 14px; line-height: 1.2; color: var(--muted); white-space: nowrap; }
.day.today { border: 2px solid var(--dark); padding: 5px 0 3px; font-weight: 700; }
.day[aria-pressed="true"] { background: var(--dark); color: #fff; border-color: var(--dark); }
.day .da.over { color: var(--red); font-weight: 700; }
.day[aria-pressed="true"] .da { color: #fff; }
.day[aria-pressed="true"] .da.over { color: #fca5a5; }
.daypad { min-height: 56px; }

/* 입력 폼 */
.field { margin: 0 0 14px; padding: 0; border: 0; min-width: 0; }
.field > label, .field > legend { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; padding: 0; }
input[type="date"], input[type="number"], input[type="text"] {
  width: 100%; height: 48px; padding: 0 12px; font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--mid); border-radius: 10px;
}
.err { color: var(--red); font-size: 14px; min-height: 0; margin-top: 4px; }
.hint { color: var(--muted); font-size: 14px; margin: -6px 0 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg.three { grid-template-columns: 1fr 1fr 1fr; }
.notify { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 16px; }
.notify .btn { width: 100%; }
.titlebox { display: flex; align-items: center; gap: 10px; }
.bell { position: relative; width: 44px; height: 44px; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
.newlist { list-style: none; margin: 0; padding: 0; }
.newlist li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.newlist li:last-child { border-bottom: 0; }
.newlist .nw { font-weight: 600; overflow-wrap: anywhere; }
.newlist .nm2 { color: var(--muted); font-size: 14px; }
.prog { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 0 0 6px; }
.prog > div { height: 100%; background: var(--dark); }
.prog.over > div { background: var(--red); }
.progtxt { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.status { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.goalrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px 0 10px; }
.goalrow .link { min-height: 40px; padding: 0 4px; }
.seg > div { position: relative; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg label {
  display: flex; align-items: center; justify-content: center; min-height: 48px;
  border: 1px solid var(--mid); border-radius: 10px; background: var(--surface); pointer-events: none;
}
.seg input:checked + label { background: var(--dark); color: #fff; border-color: var(--dark); font-weight: 700; }
.seg input:focus-visible + label { outline: 3px solid var(--dark); outline-offset: 2px; }
.actions { display: flex; gap: 8px; }
.actions .primary { flex: 1; }

/* 내역 목록 */
.listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 28px 4px 12px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.tabs button { flex: 1; margin-bottom: -1px; }
.dategroup { margin-top: 20px; }
.dategroup h3 { display: flex; justify-content: space-between; padding: 0 4px 8px; }
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(28,25,23,.05); }
.item { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.row { display: flex; justify-content: space-between; gap: 12px; }
.main { min-width: 0; }
.memo { font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 14px; }
.item .amt { font-weight: 700; white-space: nowrap; }
.acts { display: flex; justify-content: flex-end; gap: 4px; margin: 0 -8px -4px; }

/* 월간 비교 */
.cmp { list-style: none; margin: 0; padding: 0; }
.cmp li + li { margin-top: 8px; }
.cmp button {
  width: 100%; text-align: left; font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; touch-action: manipulation;
}
.cmp button[aria-current="true"] { border: 2px solid var(--dark); padding: 11px; }
.cmp .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cmp .mn { font-weight: 700; }
.cmp .bartrack { height: 8px; border-radius: 4px; background: var(--line); margin: 8px 0 6px; overflow: hidden; }
.cmp .barfill { height: 100%; background: var(--mid); }
.cmp .split { color: var(--muted); font-size: 14px; }
.delta { font-size: 14px; font-weight: 700; }
.delta.up { color: var(--red); } .delta.down { color: var(--green); } .delta.flat { color: var(--muted); }

.foot { text-align: center; margin-top: 8px; }
.foot p { color: var(--muted); font-size: 14px; margin-bottom: 8px; }

/* 아래쪽에 잠깐 뜨는 알림 */
#toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
  max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--dark); color: #fff; padding: 10px 14px; border-radius: 10px; min-height: 48px;
}
#toast button { min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #fff; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
#toast button:focus-visible { outline-color: #fff; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<!-- ============================================================
  [2] 화면 뼈대(HTML) 영역
  - 화면에 "무엇이 있는지"만 적어둔 곳이에요.
  - 비어 있는 상자(id="summary" 등)는 아래 자바스크립트가 내용을 채워요.
============================================================= -->
<body>
<div class="wrap">

  <header class="top">
    <div class="titlebox">
      <h1>우리 가계부</h1>
      <button type="button" class="icon-btn bell" id="bellBtn" aria-label="새 소식">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge" id="bellBadge" hidden></span>
      </button>
    </div>
    <!-- 지금 쓰는 사람 선택: 나중에 로그인으로 바뀌는 부분 -->
    <div class="who" id="who" role="tablist" aria-label="지금 쓰는 사람"></div>
  </header>

  <main>
    <!-- 이달 합계 · 비율 · 차액 -->
    <section class="card" aria-labelledby="monthTitle">
      <div class="monthnav">
        <button type="button" class="icon-btn" id="prevMonth" aria-label="이전 달">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h2 id="monthTitle"></h2>
        <button type="button" class="icon-btn" id="nextMonth" aria-label="다음 달">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div id="summary"></div>
    </section>

    <!-- 달력: 날짜별 합계가 보이고, 날짜를 누르면 그날 내역만 조회 -->
    <section class="card cal" aria-labelledby="calTitle">
      <h2 id="calTitle">달력</h2>
      <p class="hint">날짜를 누르면 그날 지출을 입력할 수 있어요.</p>
      <div class="calgrid" id="calendar"></div>
    </section>

    <!-- 이달 내역 -->
    <section aria-labelledby="listTitle">
      <div class="listhead">
        <h2 id="listTitle" style="margin:0"></h2>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="작성자별 보기"></div>
      <div id="list"></div>
    </section>

    <!-- 월간 비교 -->
    <section class="card" style="margin-top:24px" aria-labelledby="cmpTitle">
      <h2 id="cmpTitle">월별 비교</h2>
      <ul class="cmp" id="compare"></ul>
    </section>
  </main>

  <footer class="foot">
    <div class="notify">
      <button type="button" class="btn" id="pushBtn">폰 알림 켜기</button>
      <button type="button" class="btn" id="nudgeBtn">상대에게 입력 알림 보내기</button>
      <p class="status" id="pushStatus"></p>
    </div>
    <p class="status" id="status"></p>
    <p>기록은 두 사람이 함께 쓰는 인터넷 저장소에 저장돼요. 가끔 백업해 두세요.</p>
    <button type="button" class="btn" id="exportBtn">엑셀(CSV)로 백업 내려받기</button>
  </footer>
</div>

<!-- 지출 입력 (달력에서 날짜를 누르면 뜨는 창) -->
    <div id="entryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle" hidden>
  <div class="modal-box">
      <h2 id="formTitle">지출 입력</h2>
      <p class="hint" id="whoHint"></p>
      <form id="form" novalidate>
        <div class="field">
          <label for="f-date">날짜</label>
          <input type="date" id="f-date" required aria-describedby="e-date">
          <p class="err" id="e-date" role="alert"></p>
        </div>

        <fieldset class="field">
          <legend>분류</legend>
          <div class="seg three">
            <div><input type="radio" name="cat" id="cat-food" value="식비" checked><label for="cat-food">식비</label></div>
            <div><input type="radio" name="cat" id="cat-life" value="생활용품"><label for="cat-life">생활용품</label></div>
            <div><input type="radio" name="cat" id="cat-etc" value="기타"><label for="cat-etc">기타</label></div>
          </div>
        </fieldset>

        <div class="field">
          <label for="f-amount">금액 (원)</label>
          <input type="text" id="f-amount" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="숫자만 입력 (예: 15000)" aria-describedby="e-amount">
          <p class="err" id="e-amount" role="alert"></p>
        </div>

        <div class="field">
          <label for="f-memo">메모</label>
          <input type="text" id="f-memo" maxlength="60" placeholder="예: 롯데슈퍼 맥주">
        </div>

        <div class="actions">
          <button type="submit" class="btn primary" id="saveBtn">저장</button>
          <button type="button" class="btn" id="cancelBtn">취소</button>
        </div>
      </form>
      </div>
</div>

<!-- 목표금액 수정 -->
<div id="goalModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="goalTitle" hidden>
  <div class="modal-box">
    <h2 id="goalTitle">목표금액 수정</h2>
    <p class="hint" id="goalHint"></p>
    <form id="goalForm" novalidate>
      <div class="field">
        <label for="goalInput">목표금액 (만원 단위)</label>
        <input type="text" id="goalInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="숫자만 입력 (예: 80)" aria-describedby="e-goal">
        <p class="err" id="e-goal" role="alert"></p>
      </div>
      <button type="submit" class="btn primary">저장</button>
      <button type="button" class="btn" id="goalCancel">취소</button>
    </form>
  </div>
</div>

<!-- 새 소식 (상대방이 추가·수정한 지출) -->
<div id="newsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="newsTitle" hidden>
  <div class="modal-box">
    <h2 id="newsTitle">새 소식</h2>
    <div id="newsBody"></div>
    <button type="button" class="btn" id="newsClose">닫기</button>
  </div>
</div>

<!-- 누구세요? -->
<div id="userModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="userTitle" hidden>
  <div class="modal-box">
    <h2 id="userTitle">누구세요?</h2>
    <p class="hint">고르면 이 폰에 저장돼요. 지출에 이름이 남아요.</p>
    <div class="seg" id="userChoices"></div>
  </div>
</div>

<!-- Firebase 연결 (가계부 전용 프로젝트 gagyebu-2026-b051a, 컬렉션: gagyebuEntries / gagyebuGoals) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, doc, onSnapshot, writeBatch, setDoc, deleteDoc, addDoc }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

  var app = initializeApp({
    apiKey: "AIzaSyDsq6saXjTb5DYPFTMBfISglGz75xaw0oQ",
    authDomain: "gagyebu-2026-b051a.firebaseapp.com",
    projectId: "gagyebu-2026-b051a",
    storageBucket: "gagyebu-2026-b051a.firebasestorage.app",
    messagingSenderId: "338008558401",
    appId: "1:338008558401:web:9ef36e147173ded459afc0"
  });
  var db = getFirestore(app);

  function watch(name, onData, onStatus) {
    return onSnapshot(collection(db, name), function (snap) {
      var list = [];
      snap.forEach(function (d) { list.push(d.data()); });
      onData(list, snap.metadata.fromCache);
      onStatus(snap.metadata.fromCache ? 'syncing' : 'online');
    }, function (err) { onStatus('error', err.code); });
  }

  window.cloud = {

    var body = $('#newsBody');
    body.replaceChildren(list.length
      ? h('ul', { class: 'newlist' }, list.slice(0, 30).map(function (e) {
          return h('li', null,
            h('p', { class: 'nw' }, e.updatedBy + '님이 ' + (e.createdAt === e.updatedAt ? '추가' : '수정') + ' · ' + (e.memo || '(메모 없음)') + ' ' + fmtWon(e.amount)),
            h('p', { class: 'nm2' }, fmtDate(e.date) + ' · ' + e.cat));
        }))
      : h('p', { class: 'empty' }, '새 소식이 없어요.'));
    setSeen(Date.now());
    renderBell();
    $('#newsModal').hidden = false;
  }

  function goalOf(ym) {
    if (goals[ym] > 0) return goals[ym];
    var prev = Object.keys(goals).filter(function (k) { return k < ym && goals[k] > 0; }).sort().pop();
    return prev ? goals[prev] : DEFAULT_GOAL;      // 이전에 정한 목표가 있으면 이어받고, 없으면 기본값
  }
  function digitsOnly(input) { input.addEventListener('input', function () { var v = input.value.replace(/\D/g, ''); if (v !== input.value) input.value = v; }); }

  /* ---------- (3) 작은 도구 함수들 ---------- */
  function $(s) { return document.querySelector(s); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDate(s) { var p = s.split('-').map(Number); return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일'; }   // 2026년 9월 22일
  function fmtMonth(ym) { var p = ym.split('-').map(Number); return p[0] + '년 ' + p[1] + '월'; }
  function fmtWon(n) { return n.toLocaleString('ko-KR') + '원'; }
  // 달력 칸처럼 좁은 곳에 쓰는 짧은 금액 표시 (예: 129,400 → 13만, 4,500 → 4.5천)
  function fmtShort(n) {
    if (n >= 100000) return Math.round(n / 10000) + '만';
    if (n >= 10000) return (Math.round(n / 1000) / 10) + '만';
    return (Math.round(n / 100) / 10) + '천';
  }
  function fmtGoal(n) { return n % 10000 === 0 ? (n / 10000) + '만원' : fmtWon(n); }
  function shiftMonth(ym, delta) {
    var p = ym.split('-').map(Number), y = p[0], m = p[1] + delta;
    while (m > 12) { m -= 12; y++; }
    while (m < 1) { m += 12; y--; }
    return y + '-' + pad(m);
  }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function reducedMotion() { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }

  // 화면 조각을 안전하게 만드는 도구 (메모에 이상한 글자가 있어도 그대로 "글자"로만 보여줘요)
  function h(tag, props) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) {
        if (c == null || c === false) return;
        n.append(c.nodeType ? c : document.createTextNode(c));
      });
    }
    return n;
  }

  /* ---------- (4) 계산하기 ---------- */
  // 한 달치 합계: 사람별 금액, 전체 합계, 내역 목록
  function monthStats(ym) {
    var by = { '한나': 0, '동일': 0 }, cat = { '식비': 0, '생활용품': 0, '기타': 0 };
    var list = entries.filter(function (e) { return e.date.indexOf(ym) === 0; });
    list.forEach(function (e) {
      if (by[e.who] != null) by[e.who] += e.amount;
      if (cat[e.cat] != null) cat[e.cat] += e.amount;
    });
    return { by: by, cat: cat, total: by['한나'] + by['동일'], list: list };
  }

  /* ---------- (5) 화면 그리기 ---------- */
  function renderWho() {
    $('#who').replaceChildren.apply($('#who'), PEOPLE.map(function (p) {
      return h('button', { type: 'button', role: 'tab', 'aria-selected': String(p === user), onclick: function () { setUser(p); } }, p);
    }));
    $('#whoHint').textContent = '지금은 "' + user + '" 이름으로 기록돼요.';
  }

  function renderSummary() {
    var s = monthStats(month), by = s.by, total = s.total;
    $('#monthTitle').textContent = fmtMonth(month);
    var box = $('#summary');
    var goal = goalOf(month);
    var kids = [h('p', { class: 'label' }, '이달 합계'), h('p', { class: 'big num' }, fmtWon(total)),
      h('div', { class: 'goalrow' },
        h('span', { class: 'label num' }, '목표 ' + fmtGoal(goal)),
        h('button', { type: 'button', class: 'link', onclick: openGoalModal }, '목표금액 수정')),
      h('div', { class: 'prog' + (total > goal ? ' over' : ''), role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.min(100, Math.round(total / goal * 100))), 'aria-label': '목표 사용률' },
        h('div', { style: 'width:' + Math.min(100, total / goal * 100) + '%' })),
      h('p', { class: 'progtxt num' }, '목표의 ' + Math.round(total / goal * 100) + '% 사용 · ' + (total > goal ? fmtWon(total - goal) + ' 초과' : '남은 금액 ' + fmtWon(goal - total)))];

    if (total === 0) {
      kids.push(h('p', { class: 'empty' }, '이 달에는 아직 기록이 없어요. 아래에서 첫 지출을 입력해 보세요.'));
      box.replaceChildren.apply(box, kids);
      return;
    }

    var hp = Math.round(by['한나'] / total * 100), dp = 100 - hp;
    var pct = { '한나': hp, '동일': dp };

    // 막대를 누르면 그 사람의 금액이 아래에 나타나요. 같은 막대를 다시 누르면 사라져요.
    var reveal = h('p', { class: 'reveal', 'aria-live': 'polite' }, '막대를 누르면 금액이 보여요.');
    var shownWho = null;
    function toggleAmount(p) {
      shownWho = (shownWho === p) ? null : p;
      reveal.textContent = shownWho ? shownWho + ' ' + fmtWon(by[shownWho]) : '막대를 누르면 금액이 보여요.';
      reveal.className = 'reveal' + (shownWho ? ' on' : '');
    }
    function seg(p, cls) {
      return h('button', {
        type: 'button', class: cls, style: 'width:' + (by[p] / total * 100) + '%',
        'aria-label': p + ' ' + pct[p] + '%, 누르면 금액 보기', onclick: function () { toggleAmount(p); }
      }, p);
    }

    if (total > goal) {
      kids.push(h('p', { class: 'over num' }, '목표 ' + fmtGoal(goal) + '을 ' + fmtWon(total - goal) + ' 넘었어요'));
    }
    kids.push(
      h('div', { class: 'bar' }, seg('한나', 'seg-a'), seg('동일', 'seg-b'), h('span', { class: 'mid-tick', 'aria-hidden': 'true' })),
      reveal,
      h('p', { class: 'cats num' }, '식비 ' + fmtWon(s.cat['식비']) + ' · 생활용품 ' + fmtWon(s.cat['생활용품']) + ' · 기타 ' + fmtWon(s.cat['기타']))
    );
    box.replaceChildren.apply(box, kids);
  }

  function renderTabs() {
    var box = $('#tabs');
    box.replaceChildren.apply(box, ['전체'].concat(PEOPLE).map(function (f) {
      return h('button', { type: 'button', role: 'tab', 'aria-selected': String(f === filter), onclick: function () { filter = f; renderTabs(); renderList(); } }, f);
    }));
  }

  function renderList() {
    var s = monthStats(month);
    var items = s.list.filter(function (e) {
      return (filter === '전체' || e.who === filter);
    });
    var order = function (e) { return entries.indexOf(e); };
    items.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : order(b) - order(a); });
    $('#listTitle').textContent = '이달 내역 (' + items.length + '건)';
    var box = $('#list');

    if (!items.length) {
      box.replaceChildren(h('p', { class: 'empty card' }, filter === '전체' ? '이 달에는 아직 내역이 없어요.\n달력에서 날짜를 눌러 입력해 보세요.' : filter + ' 님의 내역이 이 달에는 없어요.'));
      return;
    }
    var groups = [], cur = null;
    items.forEach(function (e) {
      if (!cur || cur.date !== e.date) { cur = { date: e.date, list: [] }; groups.push(cur); }
      cur.list.push(e);
    });
    box.replaceChildren.apply(box, groups.map(function (g) {
      var sum = g.list.reduce(function (a, e) { return a + e.amount; }, 0);
      return h('div', { class: 'dategroup' },
        h('h3', null, h('span', null, fmtDate(g.date)), h('span', { class: 'num' }, fmtWon(sum))),
        h('ul', { class: 'items' }, g.list.map(function (e) {
          var name = e.memo || '메모 없음';
          return h('li', { class: 'item' },
            h('div', { class: 'row' },
              h('div', { class: 'main' }, h('p', { class: 'memo' }, e.memo || '(메모 없음)'), h('p', { class: 'meta' }, e.who + ' · ' + e.cat)),
              h('p', { class: 'amt num' }, fmtWon(e.amount))),
            h('div', { class: 'acts' },
              h('button', { type: 'button', class: 'link', 'aria-label': name + ' 수정', onclick: function () { startEdit(e.id); } }, '수정'),
              h('button', { type: 'button', class: 'link danger', 'aria-label': name + ' 삭제', onclick: function () { removeEntry(e.id); } }, '삭제')));
        })));
    }));
  }

  function renderCompare() {
    var keys = {};
    entries.forEach(function (e) { keys[e.date.slice(0, 7)] = 1; });
    keys[todayStr().slice(0, 7)] = 1; keys[month] = 1;
    var months = Object.keys(keys).sort();
    var stats = {}, max = 0;
    months.forEach(function (m) { stats[m] = monthStats(m); if (stats[m].total > max) max = stats[m].total; });
    var shown = months.slice(-12).reverse();

    $('#compare').replaceChildren.apply($('#compare'), shown.map(function (m) {
      var st = stats[m], prev = stats[shiftMonth(m, -1)], delta = null, goal = goalOf(m);
      if (prev && prev.total > 0 && st.total > 0) {
        var diff = st.total - prev.total;
        delta = diff > 0 ? h('span', { class: 'delta up num' }, '▲ 전월보다 ' + fmtWon(diff) + ' 늘었어요')
              : diff < 0 ? h('span', { class: 'delta down num' }, '▼ 전월보다 ' + fmtWon(-diff) + ' 줄었어요')
              : h('span', { class: 'delta flat' }, '전월과 같아요');
      }
      return h('li', null,
        h('button', { type: 'button', 'aria-current': String(m === month), 'aria-label': fmtMonth(m) + ' 내역 보기', onclick: function () { month = m; renderAll(); window.scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' }); } },
          h('div', { class: 'r1' }, h('span', { class: 'mn' }, fmtMonth(m)), h('span', { class: 'num' }, st.total ? fmtWon(st.total) : '기록 없음')),
          h('div', { class: 'bartrack', 'aria-hidden': 'true' }, h('div', { class: 'barfill', style: 'width:' + (max ? st.total / max * 100 : 0) + '%' })),
          h('div', { class: 'r1' },
          h('span', { class: 'split num' }, '목표 ' + fmtGoal(goal) + (st.total && st.total <= goal ? ' · 남은 금액 ' + fmtWon(goal - st.total) : '')),
          st.total > goal ? h('span', { class: 'delta up num' }, fmtWon(st.total - goal) + ' 초과') : delta)));
    }));
  }

  // 달력: 날짜마다 그날 두 사람 합계를 짧게 보여줘요. 날짜를 누르면 그날 내역만 조회돼요.
  function renderCalendar() {
    var p = month.split('-').map(Number), y = p[0], m = p[1];
    var firstDow = new Date(y, m - 1, 1).getDay();       // 1일이 무슨 요일인지 (일요일=0)
    var lastDay = new Date(y, m, 0).getDate();           // 그 달의 마지막 날짜
    var today = todayStr();
    var daySum = {};
    entries.forEach(function (e) { if (e.date.indexOf(month) === 0) daySum[e.date] = (daySum[e.date] || 0) + e.amount; });

    var cells = ['일', '월', '화', '수', '목', '금', '토'].map(function (w) { return h('div', { class: 'calhead' }, w); });
    for (var i = 0; i < firstDow; i++) cells.push(h('div', { class: 'daypad', 'aria-hidden': 'true' }));
    for (var d = 1; d <= lastDay; d++) {
      (function (d) {
        var date = month + '-' + pad(d), sum = daySum[date] || 0;
        cells.push(h('button', {
          type: 'button', class: 'day' + (date === today ? ' today' : ''),
          'aria-label': fmtDate(date) + (sum ? ', 합계 ' + fmtWon(sum) : ', 기록 없음') + (date === today ? ', 오늘' : ''),
          onclick: function () { openEntryModal(date); }
        }, h('span', { class: 'dn' }, String(d)), h('span', { class: 'da num' + (sum >= DAY_ALERT ? ' over' : '') }, sum ? fmtShort(sum) : ' ')));
      })(d);
    }
    var box = $('#calendar');
    box.replaceChildren.apply(box, cells);
  }

  function renderAll() { renderWho(); renderBell(); renderSummary(); renderCalendar(); renderTabs(); renderList(); renderCompare(); }

  /* ---------- (6) 알림 ---------- */
  function showToast(msg, actionLabel, actionFn) {
    var t = $('#toast');
    clearTimeout(toastTimer);
    t.replaceChildren(h('span', null, msg));
    if (actionLabel) t.append(h('button', { type: 'button', onclick: function () { actionFn(); t.hidden = true; } }, actionLabel));
    t.hidden = false;
    toastTimer = setTimeout(function () { t.hidden = true; }, actionLabel ? 6000 : 3000);
  }

  /* ---------- (7) 버튼을 눌렀을 때 ---------- */
  function setUser(p) {
    user = p;
    try { localStorage.setItem(KEY_USER, p); } catch (e) {}
    renderAll();
    syncPush();
  }

  function clearErrors() { $('#e-date').textContent = ''; $('#e-amount').textContent = ''; }

  function openEntryModal(date) {
    editingId = null;
    $('#f-date').value = date;
    $('#f-amount').value = ''; $('#f-memo').value = '';
    $('#form').elements['cat'].value = '식비';
    $('#formTitle').textContent = '지출 입력';
    $('#saveBtn').textContent = '저장';
    clearErrors();
    $('#entryModal').hidden = false;
    $('#f-amount').focus();
  }

  function startEdit(id) {
    var e = entries.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    editingId = id;
    $('#f-date').value = e.date;
    $('#form').elements['cat'].value = e.cat;
    $('#f-amount').value = e.amount;
    $('#f-memo').value = e.memo;
    $('#formTitle').textContent = '지출 수정';
    $('#saveBtn').textContent = '수정 저장';
    clearErrors();
    $('#entryModal').hidden = false;
    $('#f-amount').focus();
  }
  function cancelEdit() { editingId = null; clearErrors(); $('#entryModal').hidden = true; }

  function removeEntry(id) {
    var idx = entries.findIndex(function (x) { return x.id === id; });
    if (idx < 0) return;
    var removed = entries.splice(idx, 1)[0];
    if (editingId === id) cancelEdit();
    saveEntries(); renderAll(); cloudRemove(id);
    showToast('삭제했어요.', '되돌리기', function () {
      entries.splice(Math.min(idx, entries.length), 0, removed);
      saveEntries(); renderAll(); cloudSet(removed);
    });
  }

  function onSubmit(ev) {
    ev.preventDefault();
    clearErrors();
    var date = $('#f-date').value, amount = Number($('#f-amount').value), memo = $('#f-memo').value.trim();
    var cat = $('#form').elements['cat'].value, bad = null;

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { $('#e-date').textContent = '날짜를 선택해 주세요.'; bad = bad || '#f-date'; }
    if (!Number.isInteger(amount) || amount < 1) { $('#e-amount').textContent = '금액을 1원 이상의 숫자로 입력해 주세요.'; bad = bad || '#f-amount'; }
    else if (amount > 100000000) { $('#e-amount').textContent = '금액이 너무 커요. 다시 확인해 주세요.'; bad = bad || '#f-amount'; }
    if (bad) { $(bad).focus(); return; }

    if (editingId) {
      var e = entries.filter(function (x) { return x.id === editingId; })[0];
      if (e) { e.date = date; e.cat = cat; e.amount = amount; e.memo = memo; e.updatedAt = Date.now(); e.updatedBy = user; cloudSet(e); }
      showToast('수정했어요.');
    } else {
      var added = { id: newId(), who: user, date: date, cat: cat, amount: amount, memo: memo, createdAt: Date.now() };
      added.updatedAt = added.createdAt; added.updatedBy = user;
      entries.push(added);
      cloudSet(added);
      showToast(user + ' 이름으로 저장했어요.');
    }
    month = date.slice(0, 7);
    saveEntries();
    cancelEdit();
    renderAll();
  }

  function exportCsv() {
    var q = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
    var rows = entries.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var csv = '﻿날짜,분류,금액,메모,작성자\r\n' + rows.map(function (e) {
      return [q(fmtDate(e.date)), q(e.cat), e.amount, q(e.memo), q(e.who)].join(',');
    }).join('\r\n');
    var a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: '가계부_백업_' + todayStr() + '.csv' });
    document.body.append(a); a.click(); a.remove();
    showToast('백업 파일을 내려받았어요.');
  }

  /* ---------- (8) 시작하기 ---------- */
  /* ---------- 폰 알림 / 입력 알림 ---------- */
  function otherPerson() { return PEOPLE.filter(function (p) { return p !== user; })[0]; }

  function pushSupported() { return 'Notification' in window && 'serviceWorker' in navigator; }

  function registerPush() {
    return navigator.serviceWorker.register('firebase-messaging-sw.js')
      .then(function (reg) { return navigator.serviceWorker.ready.then(function () { return window.cloud.getPushToken(reg, VAPID_KEY); }); })
      .then(function (token) {
        if (!token) throw new Error('토큰을 받지 못했어요');
        return window.cloud.saveToken(token, user);
      });
  }
  function renderPushState() {
    var on = pushSupported() && Notification.permission === 'granted';
    $('#nudgeBtn').textContent = user ? otherPerson() + '님에게 입력 알림 보내기' : '상대에게 입력 알림 보내기';
    $('#pushBtn').textContent = on ? '폰 알림 켜짐 (다시 등록)' : '폰 알림 켜기';
    $('#pushStatus').textContent = !pushSupported()
      ? '이 브라우저는 알림을 지원하지 않아요. 아이폰은 홈 화면에 추가한 앱에서만 돼요.'
      : Notification.permission === 'denied' ? '알림이 차단돼 있어요. 브라우저 설정에서 허용해 주세요.'
      : on ? '이 폰은 ' + user + ' 이름으로 알림을 받아요.' : '켜면 상대가 지출을 입력할 때 폰으로 알려줘요.';
  }
  function enablePush() {
    if (!user) { askUser(); return; }
    if (!pushSupported()) { renderPushState(); return; }
    if (!window.cloud) { showToast('아직 연결 중이에요. 잠시 후 다시 눌러 주세요.'); return; }
    Notification.requestPermission().then(function (perm) {
      renderPushState();
      if (perm !== 'granted') { showToast('알림을 허용하지 않았어요.'); return; }
      return registerPush().then(function () { renderPushState(); showToast('폰 알림을 켰어요.'); });
    }).catch(function (err) { cloudFail(err); });
  }
  // 알림이 이미 허용된 기기는 열 때마다 토큰/이름을 새로 맞춰 둬요 (사용자를 바꿨을 때도)
  function syncPush() {
    renderPushState();
    if (pushSupported() && Notification.permission === 'granted' && user && window.cloud) registerPush().catch(function () {});
  }
  function sendNudge() {
    if (!user) { askUser(); return; }
    var last = 0;
    try { last = Number(localStorage.getItem(KEY_NUDGE)) || 0; } catch (e) {}
    if (Date.now() - last < 60000) { showToast('방금 보냈어요. 1분 뒤에 다시 보낼 수 있어요.'); return; }
    if (!window.cloud) { showToast('아직 연결 중이에요. 잠시 후 다시 눌러 주세요.'); return; }
    window.cloud.sendNudge(user).then(function () {
      try { localStorage.setItem(KEY_NUDGE, String(Date.now())); } catch (e) {}
      showToast(otherPerson() + '님에게 알림을 보냈어요.');
    }).catch(cloudFail);
  }

  function openGoalModal() {
    $('#goalHint').textContent = fmtMonth(month) + ' 목표예요. 다른 달은 따로 정할 수 있어요.';
    $('#goalInput').value = String(Math.round(goalOf(month) / 10000));
    $('#e-goal').textContent = '';
    $('#goalModal').hidden = false;
    $('#goalInput').focus(); $('#goalInput').select();
  }
  function onGoalSubmit(ev) {
    ev.preventDefault();
    var v = $('#goalInput').value;
    if (!/^\d+$/.test(v) || Number(v) < 1) { $('#e-goal').textContent = '1 이상의 숫자를 입력해 주세요. (만원 단위)'; return; }
    if (Number(v) > 100000) { $('#e-goal').textContent = '금액이 너무 커요. 다시 확인해 주세요.'; return; }
    goals[month] = Number(v) * 10000;
    saveGoals();
    if (window.cloud) window.cloud.setGoal(month, goals[month]).catch(cloudFail);
    $('#goalModal').hidden = true;
    renderSummary();
    showToast(fmtMonth(month) + ' 목표를 ' + fmtGoal(goals[month]) + '으로 바꿨어요.');
  }

  function askUser() {
    var box = $('#userChoices');
    box.replaceChildren.apply(box, PEOPLE.map(function (p) {
      return h('button', { type: 'button', class: 'btn', onclick: function () { $('#userModal').hidden = true; setUser(p); } }, p);
    }));
    $('#userModal').hidden = false;
  }

  function init() {
    var raw = null;
    try { raw = localStorage.getItem(KEY_ENTRIES); } catch (e) { storageOk = false; }
    if (raw === null) {
      entries = SEED.map(function (e, i) { return { id: 's' + i, who: e.who, date: e.date, cat: e.cat, amount: e.amount, memo: e.memo }; });
      saveEntries();
    } else {
      try { var a = JSON.parse(raw); entries = Array.isArray(a) ? a : []; } catch (e) { entries = []; }
    }
    try { var g = JSON.parse(localStorage.getItem(KEY_GOALS)); if (g && typeof g === 'object') goals = g; } catch (e) {}
    try { var u = localStorage.getItem(KEY_USER); if (PEOPLE.indexOf(u) >= 0) user = u; } catch (e) {}

    $('#form').addEventListener('submit', onSubmit);
    $('#cancelBtn').addEventListener('click', cancelEdit);
    $('#prevMonth').addEventListener('click', function () { month = shiftMonth(month, -1); renderAll(); });
    $('#nextMonth').addEventListener('click', function () { month = shiftMonth(month, 1); renderAll(); });
    $('#exportBtn').addEventListener('click', exportCsv);
    $('#bellBtn').addEventListener('click', openNews);
    $('#newsClose').addEventListener('click', function () { $('#newsModal').hidden = true; });
    digitsOnly($('#f-amount')); digitsOnly($('#goalInput'));
    $('#goalForm').addEventListener('submit', onGoalSubmit);
    $('#goalCancel').addEventListener('click', function () { $('#goalModal').hidden = true; });
    renderAll();
    if (!user) askUser();
    function startCloud() { window.cloud.start(onEntriesData, onGoalsData, onCloudStatus); syncPush(); }
    $('#pushBtn').addEventListener('click', enablePush);
    $('#nudgeBtn').addEventListener('click', sendNudge);
    renderPushState();
    if (window.cloud) startCloud(); else window.addEventListener('cloudready', startCloud);
  }
  init();
})();
</script>
</body>
</html>
