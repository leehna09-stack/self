<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <radialGradient id="bg" cx=".3" cy=".2" r="1.1"><stop offset="0" stop-color="#3a2f8f"/><stop offset=".55" stop-color="#15163f"/><stop offset="1" stop-color="#080a1f"/></radialGradient>
  <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a8ff"/><stop offset=".5" stop-color="#6a5cff"/><stop offset="1" stop-color="#3a8bff"/></linearGradient>
  <linearGradient id="gb" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9dffe6"/><stop offset=".55" stop-color="#2be0b8"/><stop offset="1" stop-color="#0b9d8f"/></linearGradient>
  <radialGradient id="orb" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".35" stop-color="#c9d4ff" stop-opacity=".55"/><stop offset="1" stop-color="#4c57d6" stop-opacity=".35"/></radialGradient>
  <linearGradient id="orbrim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#7f8cff" stop-opacity=".2"/></linearGradient>
  <filter id="blur16" filterUnits="userSpaceOnUse" x="-100" y="-100" width="712" height="712"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="glowA" filterUnits="userSpaceOnUse" x="-100" y="-100" width="712" height="712"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="410" cy="110" r="110" fill="#6a5cff" opacity=".35" filter="url(#blur16)"/>
<circle cx="100" cy="430" r="110" fill="#2be0b8" opacity=".22" filter="url(#blur16)"/>
<!-- ring shadow -->
<circle cx="256" cy="282" r="132" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="74" filter="url(#blur16)"/>
<g transform="rotate(-90 256 256)">
  <circle cx="256" cy="256" r="132" fill="none" stroke="#0d0f2b" stroke-width="82"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#ga)" stroke-width="72" stroke-linecap="round" stroke-dasharray="470 830" filter="url(#glowA)"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#gb)" stroke-width="72" stroke-linecap="round" stroke-dasharray="262 830" stroke-dashoffset="-552" filter="url(#glowA)"/>
</g>
<!-- ring highlights -->
