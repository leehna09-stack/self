  <circle cx="256" cy="256" r="160" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-dasharray="360 1000" stroke-dashoffset="-40"/>
  <circle cx="256" cy="256" r="100" stroke="#000" stroke-opacity=".35" stroke-width="6" stroke-dasharray="560 1000"/>
</g>
<!-- glass orb -->
<circle cx="256" cy="256" r="78" fill="#10123a" opacity=".85"/>
