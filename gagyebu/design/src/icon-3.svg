<circle cx="256" cy="256" r="77" fill="none" stroke="url(#orbrim)" stroke-width="3"/>
<g transform="translate(256 258)" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <g stroke="#fff" stroke-width="11" opacity=".95"><path d="M-36 -30 L-18 30 L0 -8 L18 30 L36 -30"/><path d="M-48 -8 H48 M-48 12 H48"/></g>
